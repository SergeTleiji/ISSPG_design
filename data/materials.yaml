materials:

  PLACEHOLDER_GEAR_STEEL:

    name: "PLACEHOLDER Gear Steel"

    material_type: "steel"

    density_kg_m3: 7850.0

    E_GPa: 205.0
    G_GPa: 80.0
    poisson_ratio: 0.29

    Sy_MPa: 900.0
    Sut_MPa: 1050.0

    # Unmodified endurance limit
    Se_prime_MPa: 500.0

    # AGMA material strength numbers
    St_MPa: 300.0
    Sc_MPa: 1000.0

    # Nominal compressive/bearing allowable
    S_br_allow_MPa: 500.0

    hardness_HB: 300

    placeholder: true


